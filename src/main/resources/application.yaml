spring:
  application:
    name: mail-handler-service

server:
  port: 8005
  servlet:
    context-path: /mail-handler

management:
  endpoints:
    web:
      exposure:
        include: health,info

microsoft:
  graph:
    tenant-id: ${M365_TENANT_ID:}
    client-id: ${M365_CLIENT_ID:}
    client-secret: ${M365_CLIENT_SECRET:}
    token-url: ${M365_TOKEN_URL:https://login.microsoftonline.com}
    api-url: ${M365_GRAPH_API_URL:https://graph.microsoft.com/v1.0}
    scope: ${M365_GRAPH_SCOPE:https://graph.microsoft.com/.default}

mail-handler:
  api-key: ${X_API_KEY:}
  mailboxes-json: ${MAIL_HANDLER_MAILBOXES_JSON:}

  poll:
    enabled: ${MAIL_HANDLER_POLL_ENABLED:false}
    fixed-delay-ms: ${MAIL_HANDLER_POLL_FIXED_DELAY_MS:60000}
    max-messages: ${MAIL_HANDLER_POLL_MAX_MESSAGES:10}
    mark-as-read-after-success: ${MAIL_HANDLER_MARK_AS_READ_AFTER_SUCCESS:true}
    fetch-attachment-content: ${MAIL_HANDLER_FETCH_ATTACHMENT_CONTENT:true}
    fail-on-attachment-content-error: ${MAIL_HANDLER_FAIL_ON_ATTACHMENT_CONTENT_ERROR:true}
