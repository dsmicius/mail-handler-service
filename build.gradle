plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'lt.sba'
version = '0.0.1-SNAPSHOT'
description = 'mail-handler-service'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def dockerRepo = 'dsmicius'
def dockerImageName = project.name
def dockerTag = 'latest'

def dockerImage = "${dockerRepo}/${dockerImageName}:${dockerTag}"
def dockerImageVersion = "${dockerRepo}/${dockerImageName}:${project.version}"

tasks.register('dockerBuildImage', Exec) {
    dependsOn bootJar
    commandLine 'docker', 'build',
            '-t', dockerImage,
            '-t', dockerImageVersion,
            '.'
}

tasks.register('dockerPushImageLatest', Exec) {
    dependsOn dockerBuildImage
    commandLine 'docker', 'push', dockerImage
}

tasks.register('dockerPushImageVersion', Exec) {
    dependsOn dockerBuildImage
    commandLine 'docker', 'push', dockerImageVersion
}

tasks.register('dockerPublishImage') {
    dependsOn dockerPushImageLatest, dockerPushImageVersion
}
